# Tool configuration only (this project is not packaged).

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Ruff's classic default rules (pycodestyle errors E4/E7/E9 and Pyflakes F)
# plus import sorting (I). Listed explicitly so new ruff versions do not change them.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
