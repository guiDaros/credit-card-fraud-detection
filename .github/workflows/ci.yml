name: CI

# Pushes to main and pull requests. Feature branches run only through their
# pull request, so the same commit is not tested twice.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same Python version as the published results (see reports/*.json).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format (ruff format --check)
        run: ruff format --check .

      # The tests use small synthetic data only; the Kaggle CSV is not needed.
      - name: Test (pytest)
        run: pytest -q
